<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="theme-color" content="#1a1d22"/>
<title>Ket OS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a1d22'/%3E%3Cpath d='M9 7v18M15 8l10 8-10 8' fill='none' stroke='%234cc2ff' stroke-width='2.2' stroke-linecap='square'/%3E%3C/svg%3E"/>
<style>
:root{
  --s:1;
  --bg:#10141a;
  --fg:#f3f5f7;
  --muted:rgba(243,245,247,.62);
  --accent:#4cc2ff;
  --danger:#c42b1c;
  --surface:rgba(28,30,34,.78);
  --elev:rgba(40,42,48,.9);
  --stroke:rgba(255,255,255,.1);
  --shadow:0 24px 64px rgba(0,0,0,.45);
  --ease:cubic-bezier(.2,0,0,1);
  --r:8px;
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --mono:"Cascadia Mono","Segoe UI Mono",ui-monospace,monospace;
  --bar:calc(52px * var(--s));
}
html,body,#root{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:not(:disabled){cursor:pointer}
button:active:not(:disabled){scale:0.96}
.boot{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100dvh;width:100%;border:0;gap:calc(14px * var(--s));
  background:#0c1016 url("wallpaper.jpg") center/cover no-repeat;
  color:var(--fg);
  transition:opacity .28s var(--ease), filter .28s var(--ease);
}
.boot::before{content:"";position:absolute;inset:0;background:rgba(8,10,14,.42)}
.boot > *{position:relative}
.boot.out{opacity:0;filter:blur(8px)}
.boot h1{font-size:calc(34px * var(--s));font-weight:600;margin:0;letter-spacing:.04em}
.boot p{font-size:calc(14px * var(--s));color:var(--muted);margin:0}
.boot pre{max-width:min(40rem,80vw);font:calc(12px * var(--s))/1.5 var(--mono);color:var(--muted);text-align:left;background:rgba(0,0,0,.28);padding:12px 14px;border-radius:var(--r);backdrop-filter:blur(16px)}
.mark{font-size:calc(56px * var(--s));line-height:1;color:var(--accent)}
.desk{
  height:100dvh;position:relative;overflow:hidden;
  background:#10141a url("wallpaper.jpg") center/cover no-repeat;
}
.desk.desk-in{animation:deskIn .45s var(--ease)}
@keyframes deskIn{from{opacity:.4;filter:blur(10px)}to{opacity:1;filter:none}}
.icons{
  position:absolute;top:calc(18px * var(--s));left:calc(14px * var(--s));
  display:flex;flex-direction:column;gap:calc(6px * var(--s));z-index:1;
}
.desk-icon{
  width:calc(100px * var(--s));
  min-height:calc(90px * var(--s));
  height:auto !important;
  overflow:visible !important;
  display:flex;flex-direction:column;align-items:center;gap:calc(6px * var(--s));
  padding:calc(8px * var(--s)) calc(4px * var(--s)) calc(6px * var(--s));
  border-radius:4px;border:1px solid transparent;color:#fff;
  transition:background .15s var(--ease), border-color .15s var(--ease), transform .15s var(--ease);
}
.desk.desk-in .desk-icon{animation:iconIn .4s var(--ease) both}
.desk.desk-in .desk-icon:nth-child(1){animation-delay:40ms}
.desk.desk-in .desk-icon:nth-child(2){animation-delay:70ms}
.desk.desk-in .desk-icon:nth-child(3){animation-delay:100ms}
.desk.desk-in .desk-icon:nth-child(4){animation-delay:130ms}
.desk.desk-in .desk-icon:nth-child(5){animation-delay:160ms}
.desk.desk-in .desk-icon:nth-child(6){animation-delay:190ms}
.desk.desk-in .desk-icon:nth-child(7){animation-delay:220ms}
.desk.desk-in .desk-icon:nth-child(8){animation-delay:250ms}
.desk.desk-in .desk-icon:nth-child(9){animation-delay:280ms}
.desk.desk-in .desk-icon:nth-child(10){animation-delay:310ms}
@keyframes iconIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.desk-icon:hover,.desk-icon:focus-visible{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.2)}
.tile{
  width:calc(48px * var(--s));height:calc(48px * var(--s));border-radius:calc(11px * var(--s));
  display:grid;place-items:center;color:#fff;
  box-shadow:0 6px 16px rgba(0,0,0,.32);
  transition:transform .18s var(--ease);
}
.desk-icon:hover .tile{transform:translateY(-2px) scale(1.05)}
.tile svg{width:62%;height:62%}
.desk-icon .name{
  display:block;width:100%;
  font-size:calc(12px * var(--s));line-height:1.25;font-weight:500;
  text-align:center;color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.9), 0 0 10px rgba(0,0,0,.45);
  white-space:nowrap;overflow:visible;
}
.win{
  position:absolute;display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--stroke);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;
  backdrop-filter:blur(40px) saturate(1.4);
}
.win.focus{border-color:rgba(76,194,255,.35)}
.win.enter{animation:winIn .22s var(--ease)}
.win.leave{opacity:0;transform:scale(.97) translateY(8px);filter:blur(4px);transition:opacity .15s ease-in, transform .15s ease-in, filter .15s ease-in}
@keyframes winIn{from{opacity:0;transform:scale(.97) translateY(10px)}to{opacity:1;transform:none}}
.title{
  height:calc(36px * var(--s));display:flex;align-items:center;justify-content:space-between;
  padding-left:calc(14px * var(--s));background:rgba(255,255,255,.03);
  cursor:grab;user-select:none;font-size:calc(13px * var(--s));font-weight:500;
}
.wbtn{display:flex;height:100%}
.cap{
  width:calc(46px * var(--s));height:100%;border:0;border-radius:0;background:transparent;
  color:var(--fg);font-size:calc(12px * var(--s));
  transition:background .12s var(--ease);
}
.cap:hover{background:rgba(255,255,255,.1)}
.cap.close:hover{background:var(--danger);color:#fff}
.body{flex:1;min-height:0;overflow:auto;position:relative}
.se{position:absolute;right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize}
.taskbar{
  position:absolute;left:calc(10px * var(--s));right:calc(10px * var(--s));bottom:calc(10px * var(--s));
  height:var(--bar);display:flex;align-items:center;justify-content:center;
  background:rgba(24,26,30,.55);border:1px solid var(--stroke);border-radius:var(--r);
  backdrop-filter:blur(48px) saturate(1.5);z-index:300;
  box-shadow:0 8px 32px rgba(0,0,0,.28);
}
.tb-cluster{display:flex;gap:calc(4px * var(--s));align-items:center}
.tb-btn{
  width:calc(40px * var(--s));height:calc(40px * var(--s));border-radius:6px;
  display:grid;place-items:center;position:relative;
  transition:background .15s var(--ease);
}
.tb-btn:hover{background:rgba(255,255,255,.1)}
.tb-btn.on{background:rgba(255,255,255,.12)}
.tb-btn.on::after{
  content:"";position:absolute;bottom:4px;width:12px;height:3px;border-radius:99px;background:var(--accent);
}
.tb-btn svg,.tb-start svg{width:20px;height:20px}
.tb-start{width:calc(42px * var(--s));height:calc(40px * var(--s));border-radius:6px;display:grid;place-items:center;color:var(--accent)}
.tb-start:hover{background:rgba(76,194,255,.12)}
.tb-start.open{background:rgba(76,194,255,.16)}
.tray{
  position:absolute;right:calc(10px * var(--s));top:0;bottom:0;
  display:flex;align-items:center;gap:calc(12px * var(--s));
  font-family:var(--mono);font-size:calc(11px * var(--s));color:var(--muted);white-space:nowrap;
}
.clock{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;color:var(--fg);font-size:calc(12px * var(--s))}
.clock small{font-size:calc(11px * var(--s));color:var(--muted);font-weight:400}
.start{
  position:absolute;left:50%;bottom:calc(68px * var(--s));
  width:min(580px, calc(100vw - 24px));
  background:rgba(28,30,36,.72);border:1px solid var(--stroke);border-radius:12px;
  backdrop-filter:blur(50px) saturate(1.5);box-shadow:var(--shadow);
  padding:calc(16px * var(--s));z-index:280;
  opacity:0;visibility:hidden;pointer-events:none;
  translate:-50% 14px;scale:.98;
  transition:opacity .18s var(--ease), translate .18s var(--ease), scale .18s var(--ease), visibility 0s linear .18s;
}
.start.open{opacity:1;visibility:visible;pointer-events:auto;translate:-50% 0;scale:1;transition-delay:0s}
.start h3{margin:0 0 12px;font-size:calc(13px * var(--s));font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.pins{display:grid;grid-template-columns:repeat(5,1fr);gap:calc(8px * var(--s))}
.pin{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:10px 4px;border-radius:8px;color:var(--fg);
  transition:background .15s var(--ease);
}
.pin:hover{background:rgba(255,255,255,.1)}
.pin .name{font-size:calc(12px * var(--s));text-align:center;white-space:nowrap}
.pad{padding:calc(16px * var(--s));display:flex;flex-direction:column;gap:calc(10px * var(--s))}
.muted{color:var(--muted);font-size:calc(12px * var(--s))}
.mono{font-family:var(--mono);font-size:calc(12px * var(--s))}
.screen{font-size:calc(36px * var(--s));text-align:right;font-family:var(--mono)}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(6px * var(--s))}
.keys button,.pad > button,.row button{
  background:var(--elev);color:var(--fg);border:1px solid var(--stroke);
  border-radius:6px;height:calc(34px * var(--s));min-width:calc(34px * var(--s));padding:0 10px;
  font-size:calc(13px * var(--s));
  transition:background .12s var(--ease), border-color .12s var(--ease);
}
.keys button:hover,.pad > button:hover,.row button:hover{background:rgba(255,255,255,.12)}
.keys .span2{grid-column:span 2}
.keys .eq,button.eq{background:var(--accent);color:#0b1a22;border-color:transparent;font-weight:600}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
input,textarea{
  background:rgba(0,0,0,.28);color:var(--fg);border:1px solid var(--stroke);
  border-radius:6px;padding:8px 10px;font:inherit;outline:none;
}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:160px;width:100%}
.qubits{display:flex;flex-wrap:wrap;gap:8px}
.q{display:flex;flex-direction:column;align-items:center;font-size:calc(11px * var(--s));color:var(--muted)}
.meter{flex:1;border:1px solid var(--stroke);background:rgba(0,0,0,.2);border-radius:12px;padding:10px 10px 22px;position:relative}
.meter i{position:absolute;left:10px;bottom:10px;height:6px;background:var(--accent);border-radius:99px;transition:width .18s var(--ease)}
.spec{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.spec-row{display:flex;flex-direction:column;gap:4px;padding:12px 14px;background:rgba(255,255,255,.04);border:1px solid var(--stroke);border-radius:8px}
.spec-row .k{font-size:calc(11px * var(--s));color:var(--muted);letter-spacing:.06em}
.spec-row .v{font-size:calc(13px * var(--s));line-height:1.45;word-break:break-all}
.meter span{float:right;font-family:var(--mono)}
table{width:100%;border-collapse:collapse;font-size:calc(12px * var(--s))}
td,th{border-bottom:1px solid var(--stroke);padding:6px;text-align:left}
.hist{display:flex;align-items:end;gap:6px;height:100px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:end;gap:4px}
.bar i{width:16px;background:var(--accent);display:block}
.cell{width:calc(32px * var(--s));height:calc(32px * var(--s));margin:2px}
.crow{display:flex;align-items:center;gap:4px}
.frow{display:flex;justify-content:space-between;gap:8px;padding:4px 0}
.frow.on{background:rgba(255,255,255,.06)}
.term pre{min-height:240px;background:rgba(0,0,0,.28);padding:8px;overflow:auto}
.danger{color:#e08882}
dl{display:grid;grid-template-columns:calc(120px * var(--s)) 1fr;gap:6px;font-size:calc(13px * var(--s))}
dt{color:var(--muted)}
.err{color:#e08882;padding:24px;font-family:var(--mono)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="app.js?v=qa1"></script>
</body>
</html>
