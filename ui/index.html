<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="theme-color" content="#0b0c0e"/>
<title>Ket OS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0c0e'/%3E%3Cpath d='M9 7v18M15 8l10 8-10 8' fill='none' stroke='%23e8eaee' stroke-width='2.2' stroke-linecap='square'/%3E%3C/svg%3E"/>
<style>
:root{--s:1;--fg:#e8eaee;--muted:#8b909a;--line:#2a2e38;--bg:#0b0c0e;--panel:#12141a;--elev:#181b22}
html,body,#root{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:ui-sans-serif,system-ui,"Segoe UI",sans-serif}
button:not(:disabled){cursor:pointer}
.boot{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100dvh;width:100%;background:var(--bg);color:var(--fg);gap:calc(12px * var(--s));border:0}
.boot pre{max-width:min(42rem,80vw);font-size:calc(13px * var(--s));color:var(--muted);text-align:left;white-space:pre-wrap}
.boot h1{font-size:calc(28px * var(--s));font-weight:600;margin:0}
.boot p{font-size:calc(14px * var(--s));color:var(--muted)}
.mark{font-size:calc(48px * var(--s));line-height:1}
.desk{height:100dvh;position:relative;overflow:hidden;background:
  radial-gradient(80vw 50vw at 78% 12%, #1c2433 0%, transparent 58%),
  radial-gradient(50vw 40vw at 8% 88%, #141820 0%, transparent 52%),
  var(--bg)}
.desk::before{content:"⟩";position:absolute;right:6%;bottom:14%;font-size:min(42vh,22vw);color:#e8eaee;opacity:.045;pointer-events:none;line-height:1;font-weight:300}
.icons{position:absolute;top:calc(28px * var(--s));left:calc(22px * var(--s));display:grid;grid-template-columns:repeat(2,calc(112px * var(--s)));gap:calc(18px * var(--s)) calc(12px * var(--s));z-index:1}
.icon{width:calc(112px * var(--s));display:flex;flex-direction:column;align-items:center;gap:calc(8px * var(--s));color:var(--fg);background:none;border:0;padding:calc(6px * var(--s));border-radius:calc(12px * var(--s))}
.icon:hover{background:#ffffff10}
.icon span{width:calc(64px * var(--s));height:calc(64px * var(--s));display:grid;place-items:center;border:1px solid var(--line);background:#12141ae6;border-radius:calc(14px * var(--s));font-size:calc(26px * var(--s));line-height:1}
.icon em{font-style:normal;font-size:calc(13px * var(--s));line-height:1.25;text-shadow:0 1px 2px #000;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.win{position:absolute;display:flex;flex-direction:column;border:1px solid var(--line);background:var(--panel);box-shadow:0 18px 50px -24px #000000b8;border-radius:calc(12px * var(--s));overflow:hidden}
.win.focus{border-color:#b4bcc8}
.title{height:calc(38px * var(--s));display:flex;align-items:center;justify-content:space-between;padding:0 calc(8px * var(--s)) 0 calc(12px * var(--s));background:var(--elev);cursor:grab;user-select:none;font-size:calc(13px * var(--s))}
.wbtn{display:flex;gap:4px}
.wbtn button,.dock button,.keys button,button{background:var(--elev);color:var(--fg);border:1px solid var(--line);border-radius:calc(6px * var(--s));height:calc(30px * var(--s));min-width:calc(30px * var(--s));padding:0 calc(10px * var(--s));font-size:calc(13px * var(--s))}
.body{flex:1;min-height:0;overflow:auto;position:relative}
.se{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize}
.dock{position:absolute;left:0;right:0;bottom:0;height:calc(56px * var(--s));display:flex;align-items:center;gap:calc(8px * var(--s));padding:0 calc(12px * var(--s));background:#12141af2;border-top:1px solid var(--line);z-index:220}
.dock .ket{font-weight:650;letter-spacing:.04em;min-width:calc(52px * var(--s))}
.dock .on{background:#2a3140;border-color:#6a7380}
.tray{margin-left:auto;display:flex;gap:calc(14px * var(--s));font-family:ui-monospace,monospace;font-size:calc(12px * var(--s));color:var(--muted);white-space:nowrap}
.start{position:absolute;bottom:calc(64px * var(--s));left:calc(10px * var(--s));width:calc(260px * var(--s));background:var(--panel);border:1px solid var(--line);border-radius:calc(12px * var(--s));padding:calc(8px * var(--s));display:flex;flex-direction:column;gap:4px;z-index:210}
.start button{height:calc(34px * var(--s));text-align:left}
.pad{padding:calc(16px * var(--s));display:flex;flex-direction:column;gap:calc(10px * var(--s))}
.muted{color:var(--muted);font-size:calc(12px * var(--s))}
.mono{font-family:ui-monospace,monospace;font-size:calc(12px * var(--s))}
.screen{font-size:calc(36px * var(--s));text-align:right;font-family:ui-monospace,monospace}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(6px * var(--s))}
.keys .span2{grid-column:span 2}
.keys .eq,button.eq{background:#d5dae2;color:var(--bg)}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
input,textarea{background:var(--elev);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
textarea{min-height:160px;width:100%}
.qubits{display:flex;flex-wrap:wrap;gap:8px}
.q{display:flex;flex-direction:column;align-items:center;font-size:calc(11px * var(--s));color:var(--muted)}
.meter{flex:1;border:1px solid var(--line);background:var(--elev);border-radius:12px;padding:10px 10px 22px;position:relative}
.meter i{position:absolute;left:10px;bottom:10px;height:6px;background:#d5dae2;border-radius:99px}
.meter span{float:right;font-family:ui-monospace,monospace}
table{width:100%;border-collapse:collapse;font-size:calc(12px * var(--s))}
td,th{border-bottom:1px solid var(--line);padding:6px;text-align:left}
.hist{display:flex;align-items:end;gap:6px;height:100px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:end;gap:4px}
.bar i{width:16px;background:#d5dae2;display:block}
.cell{width:calc(32px * var(--s));height:calc(32px * var(--s));margin:2px}
.crow{display:flex;align-items:center;gap:4px}
.frow{display:flex;justify-content:space-between;gap:8px;padding:4px 0}
.frow.on{background:var(--elev)}
.term pre{min-height:240px;background:var(--elev);padding:8px;overflow:auto}
.danger{color:#b87a76}
dl{display:grid;grid-template-columns:calc(120px * var(--s)) 1fr;gap:6px;font-size:calc(13px * var(--s))}
dt{color:var(--muted)}
.err{color:#b87a76;padding:24px;font-family:ui-monospace,monospace}
@media (max-width: 720px){
  .icons{grid-template-columns:repeat(1,calc(112px * var(--s)))}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="app.js?v=4k1"></script>
</body>
</html>
